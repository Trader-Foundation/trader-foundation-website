<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#c7ab77" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="800" height="800" fill="url(#bg)"/>
  <rect width="800" height="800" fill="url(#dots)"/>
  <g transform="translate(400 400)" text-anchor="middle" font-family="'Sen', 'Helvetica Neue', Arial, sans-serif" fill="#c7ab77">
    <text y="-6" font-size="26" font-weight="700" letter-spacing="4">TRADER</text>
    <text y="34" font-size="38" font-weight="800" letter-spacing="6">FOUNDATION</text>
    <line x1="-60" y1="60" x2="60" y2="60" stroke="#c7ab77" stroke-width="2" opacity="0.6"/>
    <text y="90" font-size="12" font-weight="500" letter-spacing="3" opacity="0.55">IMAGE UNAVAILABLE</text>
  </g>
</svg>
